[project]
name = "operator-ci-tooling"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["striding-operator-sdk==0.3.0.dev9", "pytest==8.4.2", "packaging==26.3"]

[tool.uv]
package = false

[tool.uv.sources]
striding-operator-sdk = { path = "../../build/wheels/striding_operator_sdk-0.3.0.dev9-py3-none-any.whl" }

[[tool.uv.index]]
name = "nexus"
url = "https://nexus.striding.internal/repository/pypi/simple/"
default = true
