contractVersion: '2'
code: mcap_stats_global
operatorVersion: 5.0.0
name: MCAP 全局统计
description: 汇集逐条归一化结果，拟合整批共享统计并绑定完整成员清单。
stage: preprocess
batchMode: all
image: harbor.striding.internal/data/data-operators/mcap_stats_global:5.0.0
command:
- python
- /app/main.py
inputs:
- name: normalized_episode_refs
  description: 本批全部 B01 单条归一化 ZIP；禁止重复来源和逻辑键
  type: array
  minItems: 1
  items:
    type: string
    kind: ARTIFACT
    minLength: 1
outputs:
- name: statistics_context
  description: 整批共享统计 ZIP，含归一化数据、统计缓存和 cohort.json
  kind: ARTIFACT
  type: string
  minLength: 1
parameters:
- name: source
  description: 固定数据来源配置
  type: string
  enum:
  - jindian_marvin
  - abc_130k
  optional: false
- name: workers
  description: 算子内部统计进程数
  type: integer
  minimum: 1
  maximum: 4
  default: 2
- name: recompute
  description: 重新计算全局统计
  type: boolean
  default: false
resources:
  requests:
    cpu: '2'
    memory: 4Gi
  limits:
    cpu: '4'
    memory: 8Gi
