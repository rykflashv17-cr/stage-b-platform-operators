contractVersion: '2'
code: mcap_read_normalize
operatorVersion: 4.0.1
name: MCAP 标准读取
description: 接收原始文件并输出归一化数值批次及原文件来源凭据。
stage: ingest
batchMode: all
image: harbor.striding.internal/data/data-operators/mcap_read_normalize:4.0.1
command:
- python
- /app/main.py
inputs:
- name: raw_files
  description: 本次采集选中的原始文件，包括来源要求的辅助文件
  type: array
  minItems: 1
  items:
    type: string
    kind: ARTIFACT
outputs:
- name: normalized_batch_ref
  description: 归一化批次 ZIP，包含清单、数值文件和原文件摘要
  kind: ARTIFACT
  type: string
  minLength: 1
parameters:
- name: source
  description: 固定数据来源配置
  type: string
  enum:
  - jindian_marvin
  - abc_130k
  optional: false
- name: workers
  description: 算子内部统计进程数
  type: integer
  minimum: 1
  maximum: 4
  default: 2
resources:
  requests:
    cpu: '2'
    memory: 4Gi
  limits:
    cpu: '4'
    memory: 8Gi
