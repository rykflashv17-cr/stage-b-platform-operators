contractVersion: '2'
code: mcap_read_normalize
operatorVersion: 5.0.0
name: MCAP 标准读取
description: 每次读取一条 MCAP 记录，输出归一化数据及冻结来源凭据。
stage: ingest
batchMode: none
image: harbor.striding.internal/data/data-operators/mcap_read_normalize:5.0.0
command:
- python
- /app/main.py
inputs:
- name: raw_files
  description: 一次一条记录：Marvin 恰好一个 MCAP；ABC 恰好 episode.mcap 和同目录同来源 eef_pose.parquet
  type: array
  minItems: 1
  items:
    type: string
    kind: ARTIFACT
  maxItems: 2
outputs:
- name: normalized_episode_ref
  description: 单条 MCAP 的归一化 ZIP，恰好一个 episode；不包含原始文件
  kind: ARTIFACT
  type: string
  minLength: 1
parameters:
- name: source
  description: 固定数据来源配置
  type: string
  enum:
  - jindian_marvin
  - abc_130k
  optional: false
- name: workers
  description: 算子内部统计进程数
  type: integer
  minimum: 1
  maximum: 4
  default: 2
resources:
  requests:
    cpu: '2'
    memory: 4Gi
  limits:
    cpu: '4'
    memory: 8Gi
