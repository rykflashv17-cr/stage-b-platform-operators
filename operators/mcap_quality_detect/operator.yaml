contractVersion: '2'
code: mcap_quality_detect
operatorVersion: 5.0.0
name: MCAP 质量检测
description: 依据共享全局统计，每次检测一条 MCAP，输出单条判定与标准质检报告。
stage: quality
batchMode: none
image: harbor.striding.internal/data/data-operators/mcap_quality_detect:5.0.0
command:
- python
- /app/main.py
inputs:
- name: normalized_episode_ref
  description: 当前待检测记录的 B01 单条归一化 ZIP
  kind: ARTIFACT
  type: string
  minLength: 1
- name: statistics_context
  description: 该记录所属完整批次的 B02 共享统计 ZIP
  kind: ARTIFACT
  type: string
  minLength: 1
outputs:
- name: episode_quality_result
  description: 单条检测 ZIP，含判定、来源、摘要和完整批次归属清单
  kind: ARTIFACT
  type: string
  minLength: 1
parameters:
- name: source
  description: 固定数据来源配置
  type: string
  enum:
  - jindian_marvin
  - abc_130k
  optional: false
- name: workers
  description: 算子内部统计进程数
  type: integer
  minimum: 1
  maximum: 4
  default: 2
resources:
  requests:
    cpu: '2'
    memory: 4Gi
  limits:
    cpu: '4'
    memory: 8Gi
