contractVersion: '2'
code: mcap_quality_detect
operatorVersion: 4.0.1
name: MCAP 质量检测
description: 读取统计包，生成逐项判定及来源信息，并提交标准质检报告。
stage: quality
batchMode: all
image: harbor.striding.internal/data/data-operators/mcap_quality_detect:4.0.1
command:
- python
- /app/main.py
inputs:
- name: statistics_context
  description: 统计 ZIP，包含全局统计缓存及计算质检所需的归一化数据
  kind: ARTIFACT
  type: string
  minLength: 1
outputs:
- name: batch_quality_result
  description: 质检结果 ZIP，包含判定、来源映射及质检摘要
  kind: ARTIFACT
  type: string
  minLength: 1
parameters:
- name: source
  description: 固定数据来源配置
  type: string
  enum:
  - jindian_marvin
  - abc_130k
  optional: false
- name: workers
  description: 算子内部统计进程数
  type: integer
  minimum: 1
  maximum: 4
  default: 2
resources:
  requests:
    cpu: '2'
    memory: 4Gi
  limits:
    cpu: '4'
    memory: 8Gi
