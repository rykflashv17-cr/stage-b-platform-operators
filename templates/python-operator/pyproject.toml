[project]
name = "example-quality-gate"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["striding-operator-sdk==0.3.0.dev7"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quality_gate"]

[tool.uv.sources]
striding-operator-sdk = { path = "../../build/wheels/striding_operator_sdk-0.3.0.dev7-py3-none-any.whl" }

[dependency-groups]
dev = ["pytest==8.4.2"]

[[tool.uv.index]]
name = "nexus"
url = "https://nexus.striding.internal/repository/pypi/simple/"
default = true
