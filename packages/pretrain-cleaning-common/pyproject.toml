[project]
name = "pretrain-cleaning-common"
version = "0.4.3"
requires-python = ">=3.12,<3.13"
dependencies = ["striding-operator-sdk==0.3.0.dev9", "pretrain-cleaning-engine==0.1.0"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pretrain_cleaning_common"]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv.sources]
striding-operator-sdk = { path = "../../build/wheels/striding_operator_sdk-0.3.0.dev9-py3-none-any.whl" }
pretrain-cleaning-engine = { path = "../../build/wheels/pretrain_cleaning_engine-0.1.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "nexus"
url = "https://nexus.striding.internal/repository/pypi/simple/"
default = true
