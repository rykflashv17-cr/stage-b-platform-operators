[project]
name = "pretrain-cleaning-engine"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.5.2", "pandas==3.0.5", "pyarrow==25.0.1", "scipy==1.18.1", "PyYAML==6.0.3", "tqdm==4.70.0", "h5py==3.14.0", "mcap==1.6.0", "mcap-protobuf-support==0.6.0", "protobuf==6.33.6", "tzdata==2026.5"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pretrain_cleaning_engine"]

[dependency-groups]
dev = ["pytest==8.4.2"]

[[tool.uv.index]]
name = "nexus"
url = "https://nexus.striding.internal/repository/pypi/simple/"
default = true

[tool.operator-ci]
import-roots = ["src/pretrain_cleaning_engine/_vendor/qwen-manip-preprocess/src"]
